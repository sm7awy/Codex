<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Agent Orchestration Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>لوحة إدارة AI Agents</h1>
        <p>تشغيل ومراقبة منظومة الوكلاء الذكية — نسخة MVP تفاعلية</p>
      </div>
      <button id="refreshBtn">تحديث البيانات</button>
    </header>

    <main class="container">
      <section class="kpis" id="kpis"></section>

      <section class="grid">
        <article class="panel">
          <div class="panel-title-row">
            <h2>Agents</h2>
            <span class="badge" id="activeAgentsBadge"></span>
          </div>
          <table>
            <thead>
              <tr>
                <th>الاسم</th>
                <th>الدور</th>
                <th>الحالة</th>
                <th>القناة</th>
              </tr>
            </thead>
            <tbody id="agentsTable"></tbody>
          </table>
        </article>

        <article class="panel">
          <h2>طلبات الموافقة</h2>
          <div id="approvalsList" class="list"></div>
        </article>
      </section>

      <section class="grid">
        <article class="panel">
          <h2>المحادثات النشطة</h2>
          <div id="conversationsList" class="list"></div>
        </article>

        <article class="panel">
          <h2>آخر Logs</h2>
          <div id="logsList" class="logs"></div>
        </article>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
